<div class="auth-page-wrapper">
  <!-- Subtle decorative ambient background accents matching theme -->
  <div class="auth-bg-shape auth-shape-tl" aria-hidden="true"></div>
  <div class="auth-bg-shape auth-shape-br" aria-hidden="true"></div>

  <!-- Centered Split Card Container -->
  <div class="auth-card-container">
    
    <!-- Left Section: Registration Form (White) -->
    <div class="auth-form-side">
      <div class="auth-content-inner">
        <!-- Brand Header -->
        <div class="form-header text-center">
          <div class="login-brand-logo-wrap">
            <img src="assets/images/service-day-logo.png" alt="Service Day Logo" class="login-main-logo-img" />
          </div>
          <p class="form-subtitle">Create your corporate volunteer staff account.</p>
        </div>

        <!-- Accessible Alert Messages -->
        <app-alert *ngIf="errorMessage" type="error">
          {{ errorMessage }}
        </app-alert>
        <app-alert *ngIf="successMessage" type="success">
          {{ successMessage }}
        </app-alert>

        <!-- Form with rounded pill inputs -->
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate class="login-fields-form">
          
          <!-- Full Name -->
          <div class="form-group">
            <div class="input-pill-wrapper" [class.input-invalid]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
              <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" />
              </svg>
              <input
                id="register-name"
                type="text"
                class="pill-input"
                formControlName="name"
                placeholder="Full Legal Name"
                autocomplete="name"
                aria-required="true"
              />
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <div class="input-pill-wrapper" [class.input-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
              <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
              </svg>
              <input
                id="register-email"
                type="email"
                class="pill-input"
                formControlName="email"
                placeholder="Corporate Email Address"
                autocomplete="email"
                aria-required="true"
              />
            </div>
          </div>

          <!-- Department -->
          <div class="form-group">
            <div class="input-pill-wrapper">
              <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a1 1 0 110 2h-3a1 1 0 01-1-1v-2a1 1 0 00-1-1H9a1 1 0 00-1 1v2a1 1 0 01-1 1H4a1 1 0 110-2V4zm3 1h2v2H7V5zm2 4H7v2h2V9zm2-4h2v2h-2V5zm2 4h-2v2h2V9z" clip-rule="evenodd" />
              </svg>
              <select id="register-department" formControlName="department" class="pill-input pill-select">
                <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
              </select>
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <div class="input-pill-wrapper" [class.input-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
              <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
              <input
                id="register-password"
                [type]="showPassword ? 'text' : 'password'"
                class="pill-input"
                formControlName="password"
                placeholder="Create Password (min. 6 chars)"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="btn-toggle-pw"
                id="btn-toggle-reg-password"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              >
                <svg *ngIf="!showPassword" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
                <svg *ngIf="showPassword" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.262l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.479z" clip-rule="evenodd" />
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <div class="input-pill-wrapper" [class.input-invalid]="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched">
              <svg class="input-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
              <input
                id="register-confirm-password"
                [type]="showConfirmPassword ? 'text' : 'password'"
                class="pill-input"
                formControlName="confirmPassword"
                placeholder="Confirm Password"
                autocomplete="new-password"
              />
              <button
                type="button"
                class="btn-toggle-pw"
                id="btn-toggle-reg-confirm-password"
                (click)="toggleConfirmPasswordVisibility()"
                [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
              >
                <svg *ngIf="!showConfirmPassword" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                  <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
                <svg *ngIf="showConfirmPassword" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
                  <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.262l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.479z" clip-rule="evenodd" />
                  <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z" />
                </svg>
              </button>
            </div>
            <span *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="form-hint text-error">
              Passwords do not match.
            </span>
          </div>

          <div class="form-actions">
            <button
              type="submit"
              class="btn-pill-submit"
              id="btn-register-submit"
              [disabled]="isLoading"
            >
              <span *ngIf="!isLoading">SIGN UP</span>
              <span *ngIf="isLoading">CREATING ACCOUNT...</span>
            </button>
          </div>
        </form>

        <!-- Sign in switch option -->
        <div class="auth-switch-prompt text-center">
          <span class="auth-switch-text">Already have an account? </span>
          <a routerLink="/login" class="link-auth-strong" id="link-goto-login">Sign In</a>
        </div>
      </div>
    </div>

    <!-- Right Section: Brand Side (Deep Slate, sleek & unified) -->
    <div class="auth-brand-side">
      <div class="auth-brand-content text-center">
        <!-- Official White Service Day Logo -->
        <div class="auth-white-logo-wrap">
          <img src="assets/images/service-day-logo-white.png" alt="Service Day" class="auth-white-logo-img" />
        </div>
        <h2 class="auth-brand-name visually-hidden">Service Day</h2>
        <div class="auth-brand-divider" aria-hidden="true"></div>
        <p class="auth-brand-description">
          Make your time count. Connect with corporate community initiatives and make a meaningful difference.
        </p>
      </div>
    </div>

  </div>
</div>
